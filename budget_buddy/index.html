<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Budget Buddy</h1>
    <p>Track your budget and get reactions from your favorite characters!</p>
  </header>

  <main>
    <form id="budget-form">
      <label for="income">Income (Enter only once):</label>
      <input type="number" id="income" placeholder="Enter your income" required>
      
      <label for="expenses">Expenses:</label>
      <input type="number" id="expenses" placeholder="Enter your expenses" required>
      
      <button type="submit">Calculate</button>
      <button type="button" id="Clear-button">Clear</button>
    </form>

    <!-- Display the remaining balance -->
    <div id="balance">
      <p><strong>Initial Income:</strong> $<span id="initial-income">0.00</span></p>
      <p><strong>Remaining Balance:</strong> $<span id="remaining-balance">0.00</span></p>
    </div>

    <div id="result"></div>

    <div id="character">
      <img id="character-img" src="assets/remie_awe.gif" alt="Character Reaction">
    </div>
  </main>

  <footer>
    <p>Made with ❤️ for budgeting enthusiasts!</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
